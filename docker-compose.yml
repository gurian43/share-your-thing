version: "3.8"
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - ./data/db:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      - mongo
    restart: unless-stopped