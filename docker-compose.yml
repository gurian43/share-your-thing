version: "3.8"
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - ./data/db:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env.prod
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "127.0.0.1:3003:5000" # expose host 3003 (loopback) -> container 5000
    depends_on:
      - mongo
    restart: unless-stopped

# Note: frontend is built into the backend image via multi-stage build.
